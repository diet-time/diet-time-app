name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build and upload iOS beta
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.diettime.dietTime.9495H8ZN5C
      # Support either Actions Variables or Secrets. Secrets take over when a
      # value has not been created under Settings > Secrets and variables > Variables.
      APPSTORE_TEAM_ID: ${{ vars.APPSTORE_TEAM_ID || secrets.APPSTORE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID || secrets.APPSTORE_API_KEY_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate Apple configuration
        shell: bash
        run: |
          if [[ -z "$APPSTORE_TEAM_ID" ]]; then
            echo "::error::Set APPSTORE_TEAM_ID as a repository variable or secret before running this workflow."
            exit 1
          fi
          if [[ -z "$APPSTORE_ISSUER_ID" ]]; then
            echo "::error::Set APPSTORE_ISSUER_ID as a repository variable or secret before running this workflow."
            exit 1
          fi
          if [[ -z "$APPSTORE_API_KEY_ID" ]]; then
            echo "::error::Set APPSTORE_API_KEY_ID as a repository variable or secret before running this workflow."
            exit 1
          fi

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: ${{ env.APP_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ env.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ env.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Prepare iOS dependencies
        run: flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"

      - name: Generate export options
        shell: bash
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPSTORE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>com.diettime.dietTime</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archive and export IPA
        id: build
        uses: apple-actions/xcodebuild@v1
        with:
          workspace: ios/Runner.xcworkspace
          scheme: Runner
          sdk: iphoneos
          action: archive
          archive-path: .build/Archives/Runner.xcarchive
          export-options-plist: ios/ExportOptions.plist
          build-number: ${{ github.run_number }}
          build-settings: |
            CODE_SIGN_STYLE=Manual
            DEVELOPMENT_TEAM=${{ env.APPSTORE_TEAM_ID }}
            PROVISIONING_PROFILE_SPECIFIER=com.diettime.dietTime

      - name: Upload build to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.build.outputs.ipa-path }}
          issuer-id: ${{ env.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ env.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
