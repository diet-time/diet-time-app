name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build and upload iOS beta
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.diettime.dietTime
      APPSTORE_TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate Apple configuration
        shell: bash
        run: |
          if [[ -z "$APPSTORE_TEAM_ID" ]]; then
            echo "::error::Set the APPSTORE_TEAM_ID repository variable before running this workflow."
            exit 1
          fi

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: ${{ env.APP_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Prepare iOS dependencies
        run: flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"

      - name: Set the signing team in export options
        shell: bash
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :teamID $APPSTORE_TEAM_ID" \
            ios/ExportOptions.plist

      - name: Archive and export IPA
        id: build
        uses: apple-actions/xcodebuild@v1
        with:
          workspace: ios/Runner.xcworkspace
          scheme: Runner
          sdk: iphoneos
          action: archive
          archive-path: .build/Archives/Runner.xcarchive
          export-options-plist: ios/ExportOptions.plist
          build-number: ${{ github.run_number }}
          build-settings: |
            CODE_SIGN_STYLE=Manual
            DEVELOPMENT_TEAM=${{ vars.APPSTORE_TEAM_ID }}
            PROVISIONING_PROFILE_SPECIFIER=AppStore com.diettime.dietTime

      - name: Upload build to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.build.outputs.ipa-path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
